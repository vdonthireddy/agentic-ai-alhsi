services:
  alhsi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alhsi-app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Optional API keys for live LLM agents:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - alhsi_experiments:/root/.alhsi
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/state"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  alhsi_experiments:
